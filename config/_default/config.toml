# Change baseurl before deploy
baseurl = "https://digivineyard.com/"
languageCode = "zh-tw"
title = "Digital Vineyard"

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "en"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Set hasCJKLanguage = true if your defaultContentLanguage is a CJK language
# (e.g., "zh-tw" or "zh-cn" or "ja" or "ko")
# hasCJKLanguage = true

# Change it to your Disqus shortname before using
disqusShortname = "hugo-theme-stack"

[pagination]
pagerSize = 5

# Sitemap & robots
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "llms"]

# llms.txt：給 AI 的網站導覽圖（由 layouts/index.llms.txt 自動產生）
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"